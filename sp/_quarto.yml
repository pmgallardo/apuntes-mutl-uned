project:
  type: book
  output-dir: _book

book:
  title: "Semántica y pragmática"
  subtitle: "Guía de estudio de la asignatura del MUTL de la UNED"
  author: "Colaboradores de apuntes-mutl-uned"
  date: today
  language: es
  output-file: "sp" 
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-mutl-uned/sp
  repo-url: https://github.com/pmgallardo/apuntes-mutl-uned/sp
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/01.qmd
      - apuntes/02.qmd
      - apuntes/03.qmd
      - apuntes/04.qmd

lang: es

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Source Code Pro"

    fontsize: 11pt
    linestretch: 1.15

    papersize: a4

    geometry:
      - top=25mm
      - bottom=25mm
      - left=27mm
      - right=25mm

    toc: true
    toc-depth: 4
    number-sections: true
  epub: default
