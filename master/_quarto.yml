project:
  type: book
  output-dir: _book

book:
  title: "Máster universitario de tecnologías del lenguaje"
  subtitle: "Guía general del máster MUTL de la UNED"
  author: "Colaboradores de apuntes-mutl-uned"
  date: today
  language: es
  output-file: "master"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-mutl-uned/master
  repo-url: https://github.com/pmgallardo/apuntes-mutl-uned/master
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    tools:
    - icon: house
      href: https://pmgallardo.github.io/apuntes-mutl-uned
      text: "Web principal"
      
  chapters:
    - index.qmd
    - general.qmd
    - contribuciones.qmd

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{7B241C}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
