project:
  type: book
  output-dir: _book

book:
  title: "Introducción a la Investigación en Procesamiento del Lenguaje Natural"
  subtitle: "Guía de estudio de la asignatura del MUTL de la UNED"
  author: "Colaboradores de apuntes-mutl-uned"
  date: today
  language: es
  output-file: "ipnl"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-mutl-uned/ipnl
  repo-url: https://github.com/pmgallardo/apuntes-mutl-uned/ipnl
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/01-mipln/01-mipln.qmd
      - apuntes/02-ppi/01-ppi.qmd
      - apuntes/03-apme/01-apme.qmd
      - apuntes/04-de/01-de.qmd
      - apuntes/05-rad/01-rad.qmd
      - apuntes/06-ar/01-ar.qmd
      - apuntes/07-cc/01-cc.qmd

lang: es

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Source Code Pro"

    fontsize: 11pt
    linestretch: 1.15

    papersize: a4

    geometry:
      - top=25mm
      - bottom=25mm
      - left=27mm
      - right=25mm

    toc: true
    toc-depth: 4
    number-sections: true
  epub: default

