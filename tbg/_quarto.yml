project:
  type: book
  output-dir: _book

book:
  title: "Técnicas basadas en grafos aplicados al procesamiento del lenguaje"
  subtitle: "Guía de estudio de la asignatura del MUTL de la UNED"
  author: "Colaboradores de apuntes-mutl-uned"
  date: today
  language: es
  downloads: [pdf, epub]
  output-file: "tbg"
  site-url: https://pmgallardo.github.io/apuntes-mutl-uned/tbg
  repo-url: https://github.com/pmgallardo/apuntes-mutl-uned/tbg
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right-body
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{BA4A00}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
