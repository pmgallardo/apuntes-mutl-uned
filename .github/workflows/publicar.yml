name: Publicar web del MUTL UNED

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-books:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Evita que si falla un libro se cancelen los demás
      fail-fast: false
      matrix:
        asignatura: [aii, at, fpl, ipnl, master, mb, md, mp, mt, ms, rn, rt, sp, tbg, tfm]
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Evita error 403 Forbidden por tráfico anónimo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar TinyTeX para PDFs
        run: quarto install tinytex --update-path

      - name: Renderizar asignatura
        run: quarto render ${{ matrix.asignatura }}

      - name: Subir artefacto parcial
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.asignatura }}
          path: ${{ matrix.asignatura }}/_book
          retention-days: 1

  deploy:
    needs: build-books
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio (solo para index.html)
        uses: actions/checkout@v4

      - name: Crear carpeta de ensamblaje
        run: mkdir _site

      - name: Descargar todos los libros renderizados
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Ensamblar la web
        run: |
          for folder in artefactos/book-*/; do
            asignatura=$(basename "$folder" | sed 's/book-//')
            mv "$folder" "_site/$asignatura"
          done
          cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4