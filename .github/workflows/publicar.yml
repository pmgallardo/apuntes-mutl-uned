name: Publicar web del MUTL UNED

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar TinyTeX para PDFs
        run: quarto install tinytex --update-path

      - name: Crear carpeta de ensamblaje (_site)
        run: mkdir _site

      - name: Renderizar y copiar aii
        run: |
          quarto render aii
          cp -r aii/_book _site/aii

      - name: Renderizar y copiar at
        run: |
          quarto render at
          cp -r at/_book _site/at

      - name: Renderizar y copiar fpl
        run: |
          quarto render fpl
          cp -r fpl/_book _site/fpl

      - name: Renderizar y copiar ipnl
        run: |
          quarto render ipnl
          cp -r ipnl/_book _site/ipnl

      - name: Renderizar y copiar master
        run: |
          quarto render master
          cp -r master/_book _site/master

      - name: Renderizar y copiar mb
        run: |
          quarto render mb
          cp -r mb/_book _site/mb
          
      - name: Renderizar y copiar md
        run: |
          quarto render md
          cp -r md/_book _site/md

      - name: Renderizar y copiar md
        run: |
          quarto render md
          cp -r md/_book _site/md

      - name: Renderizar y copiar mp
        run: |
          quarto render mp
          cp -r mp/_book _site/mp

      - name: Renderizar y copiar ms
        run: |
          quarto render ms
          cp -r ms/_book _site/ms

      - name: Renderizar y copiar rn
        run: |
          quarto render rn
          cp -r rn/_book _site/rn

      - name: Renderizar y copiar rt
        run: |
          quarto render rt
          cp -r rt/_book _site/rt

      - name: Renderizar y copiar sp
        run: |
          quarto render sp
          cp -r sp/_book _site/sp

      - name: Renderizar y copiar tbg
        run: |
          quarto render tbg
          cp -r tbg/_book _site/tbg

      - name: Renderizar y copiar tfm
        run: |
          quarto render tfm
          cp -r tfm/_book _site/tfm

      # Repite el bloque anterior para cada asignatura adicional

      - name: Copiar página principal (index.html)
        run: cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
